[package]
name = "ladder-rank"
version = "0.1.0"
edition = "2021"
description = "Latency Ladder reference ranker: bit-exact port of cmdk 1.1.1 command-score over UTF-16, with frozen Chromium POW/lowercase tables."
license = "MIT"
publish = false
build = "build.rs"

# Standalone crate (no root Cargo workspace).
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "rank-cli"
path = "src/bin/rank-cli.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:serde_json", "dep:sha2"]

[dependencies]
# preserve_order: golden JSON keys in the same order as ranker-ts, so the files are byte-identical
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[dev-dependencies]
serde_json = "1"

[[example]]
name = "wasm_probe"
crate-type = ["cdylib"]
